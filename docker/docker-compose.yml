# Local development stack: the two app services plus the reverse proxy that
# puts them behind one origin in production.
#
#   docker compose up -d --build      start everything
#   docker compose logs -f caddy      follow the proxy
#   docker compose down               stop
#
# Caddy terminates TLS for DOMAIN. For local use, override it to serve plain
# HTTP on :8080 instead:
#
#   DOMAIN=:8080 docker compose up -d

services:
  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    restart: unless-stopped
    environment:
      PORT: "8080"
    volumes:
      # SQLite and uploaded files must outlive the container, so they are
      # bind mounts rather than anything inside the image.
      - ../backend/database:/app/database
      - ../backend/uploads:/app/uploads
    # The image runs as uid 10001, which cannot write to host files owned by
    # your user. Match the container to the host instead of chowning the repo.
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    expose:
      - "8080"
    healthcheck:
      # /api/checkstate answers without a session cookie, so it proves the
      # server and its database are both up.
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/checkstate"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: "${DOMAIN:-localhost}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

volumes:
  caddy_data:
  caddy_config:
